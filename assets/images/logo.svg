<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D36" />
      <stop offset="100%" stop-color="#C92A19" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
  </defs>
  
  <!-- Tomato & Wave Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow / Plate ring -->
    <circle cx="50" cy="50" r="46" fill="#FAF5ED" stroke="#E8D8C8" stroke-width="1.5" />
    
    <!-- Tomato Body -->
    <circle cx="43" cy="54" r="28" fill="url(#tomatoGrad)" />
    <circle cx="57" cy="54" r="28" fill="url(#tomatoGrad)" />
    <ellipse cx="50" cy="55" rx="31" ry="27" fill="url(#tomatoGrad)" />
    
    <!-- Sabah Ocean Wave motif on tomato -->
    <path d="M26 62 Q 38 54 50 62 T 74 62" stroke="#FAF5ED" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M30 69 Q 40 63 50 69 T 70 69" stroke="#FAF5ED" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Stem & Leaves -->
    <path d="M50 29 C50 20 47 16 43 14 C48 18 50 22 50 29 Z" fill="url(#leafGrad)" />
    <path d="M50 29 Q 34 22 30 27 Q 39 31 50 29 Z" fill="url(#leafGrad)" />
    <path d="M50 29 Q 66 22 70 27 Q 61 31 50 29 Z" fill="url(#leafGrad)" />
    <path d="M50 29 Q 42 36 39 42 Q 47 37 50 29 Z" fill="url(#leafGrad)" />
    <path d="M50 29 Q 58 36 61 42 Q 53 37 50 29 Z" fill="url(#leafGrad)" />
    
    <!-- Steam Swirls -->
    <path d="M43 12 Q 46 6 43 2" stroke="#C92A19" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M51 10 Q 55 5 52 0" stroke="#C92A19" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M59 13 Q 62 7 59 3" stroke="#C92A19" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Typography -->
  <!-- Chinese Brand Name -->
  <text x="126" y="58" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', serif" font-size="38" font-weight="900" fill="#1C1917" letter-spacing="2">番茄仔</text>
  
  <!-- English Brand Name -->
  <text x="254" y="56" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#C92A19" letter-spacing="1">TOMATO BOY</text>
  
  <!-- Subtitle / Origin Badge -->
  <g transform="translate(126, 74)">
    <rect x="0" y="0" width="280" height="24" rx="4" fill="#F4EAE0" />
    <text x="10" y="16" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1C3B2B" letter-spacing="1.5">SABAH TOMATO SEAFOOD NOODLES · CHERAS</text>
  </g>
</svg>
