<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23211E" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D83A27" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D83A27" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#glowGrad)" />

  <!-- Geometric / Editorial Grid Lines -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#3A3530" stroke-width="1" />
  <line x1="60" y1="940" x2="740" y2="940" stroke="#3A3530" stroke-width="1" />
  <line x1="60" y1="60" x2="60" y2="940" stroke="#3A3530" stroke-width="1" />
  <line x1="740" y1="60" x2="740" y2="940" stroke="#3A3530" stroke-width="1" />

  <!-- Corner Crosses -->
  <path d="M50 60 H70 M60 50 V70" stroke="#C92A19" stroke-width="1.5" />
  <path d="M730 60 H750 M740 50 V70" stroke="#C92A19" stroke-width="1.5" />
  <path d="M50 940 H70 M60 930 V950" stroke="#C92A19" stroke-width="1.5" />
  <path d="M730 940 H750 M740 930 V950" stroke="#C92A19" stroke-width="1.5" />

  <!-- Coordinates & Meta -->
  <text x="90" y="110" font-family="'Plus Jakarta Sans', monospace" font-size="13" font-weight="600" fill="#9C9288" letter-spacing="3">ORIGIN: SANDAKAN, SABAH (5.8394° N, 118.1172° E)</text>
  <text x="90" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#6A625A" letter-spacing="2">ARCHIVE / MASTER CHEF PROFILE</text>

  <!-- Traditional Seal Stamp -->
  <g transform="translate(620, 90)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="none" stroke="#C92A19" stroke-width="2" opacity="0.85" />
    <rect x="4" y="4" width="62" height="62" rx="4" fill="none" stroke="#C92A19" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />
    <text x="35" y="32" font-family="'Noto Serif SC', serif" font-size="15" font-weight="900" fill="#C92A19" text-anchor="middle">啊順</text>
    <text x="35" y="54" font-family="'Noto Serif SC', serif" font-size="15" font-weight="900" fill="#C92A19" text-anchor="middle">師父</text>
  </g>

  <!-- Center Chef Silhouette / Visual -->
  <g transform="translate(400, 470)">
    <!-- Aura rings -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#D83A27" stroke-width="1" opacity="0.15" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="150" fill="#1C1A17" stroke="#3A3530" stroke-width="2" />
    
    <!-- Chef Silhouette Icon -->
    <!-- Chef Hat -->
    <path d="M-40 -40 C-65 -40 -70 -70 -45 -85 C-45 -110 0 -120 20 -100 C45 -115 70 -90 55 -70 C70 -50 55 -40 40 -40 Z" fill="#E8DCD1" opacity="0.95" />
    <rect x="-38" y="-40" width="76" height="16" rx="3" fill="#D83A27" />
    
    <!-- Head & Neck -->
    <ellipse cx="0" cy="-5" rx="22" ry="24" fill="#C7B299" />
    <path d="M-10 15 L10 15 L14 30 L-14 30 Z" fill="#B59F85" />
    
    <!-- Chef Apron / Jacket Shoulders -->
    <path d="M-80 135 C-75 55 -40 32 0 32 C40 32 75 55 80 135 Z" fill="#2E2A26" stroke="#4A433D" stroke-width="2" />
    <!-- Double-breasted buttons -->
    <circle cx="-12" cy="70" r="3" fill="#E8DCD1" />
    <circle cx="12" cy="70" r="3" fill="#E8DCD1" />
    <circle cx="-12" cy="95" r="3" fill="#E8DCD1" />
    <circle cx="12" cy="95" r="3" fill="#E8DCD1" />

    <!-- Wave & Ladle motif below -->
    <path d="M-60 160 Q 0 145 60 160" stroke="#D83A27" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Information Card -->
  <g transform="translate(400, 720)">
    <!-- Label Badge -->
    <rect x="-140" y="0" width="280" height="32" rx="16" fill="#2A2421" stroke="#4A3830" stroke-width="1" />
    <circle cx="-116" cy="16" r="4" fill="#C92A19" />
    <text x="-100" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E8A598" letter-spacing="2">AUTHENTIC CHEF ARCHIVE</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="'Noto Serif SC', serif" font-size="34" font-weight="800" fill="#FAF5ED" text-anchor="middle" letter-spacing="3">啊順師父</text>
    <text x="0" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#D83A27" text-anchor="middle" letter-spacing="4">CHEF AH SOON</text>

    <!-- Sandakan Origin Quote -->
    <text x="0" y="145" font-family="'Noto Serif SC', serif" font-size="15" fill="#B3A89D" text-anchor="middle" letter-spacing="1">「把沙巴山打根的海味与浓郁番茄，煮进同一碗热汤。」</text>
    
    <!-- Notice Placeholder -->
    <rect x="-170" y="175" width="340" height="28" rx="4" fill="#1C1816" stroke="#382E28" stroke-width="1" />
    <text x="0" y="194" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8C8074" text-anchor="middle" letter-spacing="1.5">PHOTO PLACEHOLDER · 真实主厨肖像拍摄整理中</text>
  </g>
</svg>
